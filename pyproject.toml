[project]
name = "mcp-prompt-validator"
version = "0.1.0"
description = "Remote (Streamable-HTTP) MCP server: multi-category prompt validator with RBAC, dynamic skill supply, and per-user permanent tokens."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Tender Software India" }]

# ---------------------------------------------------------------------------
# Core dependencies — enough to run the server, auth, RBAC and the lightweight
# validators (secrets/regex, schema/length, fast profanity gate). The heavy
# ML detectors live in the optional [ml] extra so the base image stays small
# and CI can run without downloading model weights.
# ---------------------------------------------------------------------------
dependencies = [
  # MCP framework. Pinned to the 3.x line; the code uses only the stable
  # middleware + TokenVerifier + dependencies surface (see README "Version notes").
  "fastmcp>=3.0,<4",
  # SQLAlchemy 2.0 async ORM + Postgres async driver + migrations.
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29",
  "alembic>=1.13",
  # Settings & validation.
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  # JWT issuing/decoding (RS256/HS256). fastmcp verifies, but the server also
  # *issues* tokens, which needs PyJWT + cryptography.
  "pyjwt[crypto]>=2.8",
  # Lightweight validators / helpers.
  "jsonschema>=4.21",
  "tiktoken>=0.7",
  "better-profanity>=0.7",
  "detect-secrets>=1.5",
  # ASGI server for the HTTP transport.
  "uvicorn[standard]>=0.30",
  # Admin dashboard: Jinja2 templates, form parsing, signed session cookies.
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
# Heavy, ML-grade detectors. `pip install .[ml]` (done in the Docker image).
# First install is large (torch + transformers + spaCy + presidio + detoxify).
ml = [
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "spacy>=3.7",
  "transformers>=4.44",
  "torch>=2.2",
  "detoxify>=0.5.2",
  "huggingface-hub>=0.24",
]
# Test / dev tooling.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "aiosqlite>=0.20",  # lets the test-suite run against SQLite without Postgres
]

[project.scripts]
mpv-server = "mcp_prompt_validator.server:main"
mpv-mint-token = "mcp_prompt_validator.scripts.mint_token:main"
mpv-issue-jwt = "mcp_prompt_validator.scripts.issue_jwt:main"
mpv-seed = "mcp_prompt_validator.scripts.seed:main"
mpv-create-admin = "mcp_prompt_validator.scripts.create_admin:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_prompt_validator = ["web/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
