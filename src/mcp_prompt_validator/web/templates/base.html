<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin{% endblock %} · Prompt Validator</title>
  <style>
    :root {
      --bg: #0b1020; --bg2: #131a33; --panel: rgba(255,255,255,.04);
      --panel-solid: #161d38; --border: rgba(255,255,255,.10);
      --txt: #e8ecf8; --muted: #94a0c4; --accent: #6d8bff; --accent2: #a06bff;
      --ok: #34d399; --warn: #fbbf24; --err: #fb7185; --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--txt); font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1100px 600px at 12% -10%, rgba(109,139,255,.20), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(160,107,255,.16), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--bg2));
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }

    /* top nav */
    .nav {
      display: flex; align-items: center; gap: 6px; padding: 14px 22px;
      background: rgba(10,14,30,.6); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    }
    .brand { font-weight: 800; letter-spacing: .3px; margin-right: 18px; display: flex; gap: 9px; align-items: center; }
    .brand .dot { width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 16px var(--accent);
      animation: pulse 2.4s ease-in-out infinite; }
    .nav a.link { color: var(--muted); padding: 8px 14px; border-radius: 10px; position: relative; transition: .2s; }
    .nav a.link:hover { color: var(--txt); background: var(--panel); }
    .nav a.link.active { color: var(--txt); }
    .nav a.link.active::after {
      content: ""; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px;
      animation: grow .35s ease both;
    }
    .nav .spacer { flex: 1; }
    .who { color: var(--muted); font-size: 13px; margin-right: 10px; }
    .who b { color: var(--txt); }

    /* cards */
    .grid { display: grid; gap: 16px; }
    .cols-3 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; backdrop-filter: blur(8px); animation: fadeInUp .5s ease both;
    }
    .card:nth-child(1){animation-delay:.03s} .card:nth-child(2){animation-delay:.08s}
    .card:nth-child(3){animation-delay:.13s} .card:nth-child(4){animation-delay:.18s}
    .card:nth-child(5){animation-delay:.23s} .card:nth-child(6){animation-delay:.28s}
    .card h3 { margin: 0 0 4px; font-size: 15px; }
    .card .sub { color: var(--muted); font-size: 13px; }
    .stat { font-size: 34px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

    h1 { font-size: 22px; margin: 6px 0 18px; }
    h2 { font-size: 16px; margin: 22px 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }

    /* pills / tags */
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
      font-size: 12.5px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
    .pill.on { color: #06210f; background: linear-gradient(135deg, #6ee7b7, #34d399); border-color: transparent; font-weight: 700; }
    .pill.global { color: #1a0b2e; background: linear-gradient(135deg, #d8b4fe, var(--accent2)); border-color: transparent; font-weight: 700; }
    .pill.admin { color: #241; background: linear-gradient(135deg, #fde68a, var(--warn)); border-color: transparent; font-weight: 700; }

    /* toggle switch */
    .tog { position: relative; display: inline-block; width: 42px; height: 24px; cursor: pointer; }
    .tog input { display: none; }
    .tog .slider { position: absolute; inset: 0; background: #2a3358; border-radius: 999px; transition: .25s; border: 1px solid var(--border); }
    .tog .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 2px;
      background: #cdd6f4; border-radius: 50%; transition: .25s cubic-bezier(.5,1.6,.5,1); }
    .tog input:checked + .slider { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
    .tog input:checked + .slider::before { transform: translateX(18px); background: #fff; }

    /* tag chips grid for role skills */
    .tagrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .chip { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--panel); transition: .2s; }
    .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
    .chip.checked { background: linear-gradient(135deg, rgba(109,139,255,.18), rgba(160,107,255,.14)); border-color: var(--accent); }
    .chip code { color: var(--txt); }

    /* table */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    tr { transition: background .2s; }
    tbody tr:hover { background: var(--panel); }

    /* buttons + inputs */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 11px; border: 0;
      cursor: pointer; font-weight: 650; font-size: 14px; color: #fff; transition: transform .12s, box-shadow .2s;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 22px rgba(109,139,255,.28); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(109,139,255,.4); }
    .btn:active { transform: translateY(0); }
    .btn.ghost { background: var(--panel); color: var(--txt); border: 1px solid var(--border); box-shadow: none; }
    .btn.danger { background: linear-gradient(135deg, #fb7185, #f43f5e); box-shadow: 0 8px 22px rgba(244,63,94,.28); }
    .btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
    input, textarea, select {
      width: 100%; padding: 11px 13px; border-radius: 11px; background: rgba(0,0,0,.25);
      border: 1px solid var(--border); color: var(--txt); font: inherit; transition: border .2s, box-shadow .2s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,139,255,.2); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, "Cascadia Code", monospace; font-size: 13px; }
    .row { display: flex; gap: 12px; align-items: center; }

    /* modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(5,8,18,.66); backdrop-filter: blur(4px);
      display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 48px 16px; }
    .modal-bg.show { display: flex; animation: fade .2s ease; }
    .modal { width: 100%; max-width: 560px; background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px; animation: pop .28s cubic-bezier(.4,1.5,.5,1) both; }
    .modal h3 { margin: 0 0 4px; }

    /* toasts */
    #toasts { position: fixed; top: 18px; right: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 80; }
    .toast { padding: 12px 16px; border-radius: 12px; background: var(--panel-solid); border: 1px solid var(--border);
      color: var(--txt); box-shadow: 0 12px 30px rgba(0,0,0,.4); transform: translateX(120%); opacity: 0;
      transition: transform .4s cubic-bezier(.3,1.3,.5,1), opacity .4s; border-left: 4px solid var(--accent); min-width: 220px; }
    .toast.show { transform: translateX(0); opacity: 1; }
    .toast.ok { border-left-color: var(--ok); } .toast.error { border-left-color: var(--err); }

    .empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
    .fade-out { animation: fadeOut .35s ease forwards; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(30px); height: 0; padding: 0; margin: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 10px var(--accent); } 50% { box-shadow: 0 0 22px var(--accent2); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  {% if admin_user %}
  <nav class="nav">
    <span class="brand"><span class="dot"></span> Prompt Validator</span>
    <a class="link {% if active=='overview' %}active{% endif %}" href="{{ base }}">Overview</a>
    <a class="link {% if active=='users' %}active{% endif %}" href="{{ base }}/users">Users</a>
    <a class="link {% if active=='prompts' %}active{% endif %}" href="{{ base }}/prompts">Prompts</a>
    <a class="link {% if active=='skills' %}active{% endif %}" href="{{ base }}/skills">Skills</a>
    <span class="spacer"></span>
    <span class="who">signed in as <b>{{ admin_user }}</b></span>
    <a class="btn ghost sm" href="{{ base }}/logout">Sign out</a>
  </nav>
  {% endif %}

  <div class="wrap">
    {% block content %}{% endblock %}
  </div>

  <div id="toasts"></div>

  <script>
    const BASE = "{{ base }}";
    function toast(msg, type) {
      type = type || "ok";
      const c = document.getElementById("toasts");
      const t = document.createElement("div");
      t.className = "toast " + type;
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 420); }, 3200);
    }
    async function api(path, body, method) {
      const res = await fetch(BASE + path, {
        method: method || "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok || data.ok === false) {
        toast(data.error || ("Request failed (" + res.status + ")"), "error");
        throw new Error(data.error || res.status);
      }
      return data;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
